# Mapping: raw Tushare fields -> standardized concepts.
# Editable. `class` is the DEFAULT Penman classification consumed by Module 3;
# items whose economic classification is judgmental carry a `note` and are
# meant to be overridden per company/analysis, not treated as truth.
#
# Classes (balance sheet): operating_asset, financial_asset,
#   operating_liability, financial_obligation, equity, minority_interest,
#   subtotal, presentation_combined (Tushare combined display fields that
#   overlap granular fields — NEVER sum with them)
# Classes (income): operating_income, operating_expense, financing, tax,
#   subtotal, per_share, other_comprehensive, minority
# Classes (cashflow): operating, investing, financing, fx, subtotal,
#   supplemental (indirect-method reconciliation block)
version: 1
source: tushare
unit: CNY_yuan

balancesheet:
  period_kind: point
  fields:
